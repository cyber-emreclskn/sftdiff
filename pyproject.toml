[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sftdiff"
version = "0.1.0"
description = "See what changed in the tokens your fine-tune learns from."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
sftdiff = "sftdiff.cli:main"

[project.optional-dependencies]
hf = ["transformers>=4.45,<6"]

[tool.setuptools.packages.find]
include = ["sftdiff*"]

[tool.setuptools.package-data]
sftdiff = ["report.css", "report.js"]
